{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<h1 class="mb-4">Dashboard</h1>
<div class="row g-3">
    <div class="col-md-3">
        <div class="card">
            <div class="card-body">
                <h6 class="text-muted">Today's Arrivals</h6>
                <p class="fs-3 mb-0">&mdash;</p>
                <small class="text-muted">Wired up in Module 3</small>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card">
            <div class="card-body">
                <h6 class="text-muted">Today's Departures</h6>
                <p class="fs-3 mb-0">&mdash;</p>
                <small class="text-muted">Wired up in Module 3</small>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card">
            <div class="card-body">
                <h6 class="text-muted">Rooms Occupied</h6>
                <p class="fs-3 mb-0">&mdash;</p>
                <small class="text-muted">Wired up in Module 3</small>
            </div>
        </div>
    </div>
    <div class="col-md-3">
        <div class="card">
            <div class="card-body">
                <h6 class="text-muted">Outstanding Balances</h6>
                <p class="fs-3 mb-0">&mdash;</p>
                <small class="text-muted">Wired up in Module 4</small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
