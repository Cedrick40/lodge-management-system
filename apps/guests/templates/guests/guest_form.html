{% extends "base.html" %}
{% block content %}
<h1 class="text-xl font-semibold mb-4">{% if mode == "edit" %}Edit{% else %}Add{% endif %} Guest</h1>
<form method="post" class="max-w-md space-y-3">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded">Save</button>
</form>
{% endblock %}
