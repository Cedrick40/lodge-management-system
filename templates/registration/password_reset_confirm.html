{% extends "base.html" %}
{% block title %}Set New Password{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <h1 class="mb-4">Set a New Password</h1>
        {% if validlink %}
            <form method="post">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary">Change Password</button>
            </form>
        {% else %}
            <p>This password reset link is invalid or has expired. Request a new one
            from the <a href="{% url 'password_reset' %}">reset page</a>.</p>
        {% endif %}
    </div>
</div>
{% endblock %}
