{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <h1 class="mb-4">Lodge Login</h1>
        {% if form.errors %}
            <div class="alert alert-danger">Incorrect username or password.</div>
        {% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Username</label>
                {{ form.username }}
            </div>
            <div class="mb-3">
                <label class="form-label">Password</label>
                {{ form.password }}
            </div>
            <button type="submit" class="btn btn-primary">Log In</button>
        </form>
        <p class="mt-3"><a href="{% url 'password_reset' %}">Forgot your password?</a></p>
    </div>
</div>
{% endblock %}
